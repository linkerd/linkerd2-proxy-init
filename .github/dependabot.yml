version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # k8s.io modules are released in lockstep and must be bumped together;
      # e.g. k8s.io/api@v0.36 does not compile against k8s.io/apimachinery@v0.37.
      kubernetes:
        patterns:
          - "k8s.io/*"
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # kube and k8s-openapi must move together or the build breaks
      kube:
        patterns:
          - "kube"
          - "kube-*"
          - "k8s-openapi"
      # listed before tokio so tokio-rustls lands here: a dependency
      # joins the first group whose patterns it matches
      tls:
        patterns:
          - "rustls"
          - "rustls-*"
          - "*-rustls"
          - "webpki-roots"
          - "ring"
          - "aws-lc-rs"
          - "openssl"
          - "openssl-*"
          - "native-tls"
          - "*-native-tls"
      tokio:
        patterns:
          - "tokio"
          - "tokio-*"
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directories:
    - "/"
    - ".github/actions/version-mode"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/proxy-init/integration/iptables"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
